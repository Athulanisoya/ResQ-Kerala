{% from 'icons.html' import icon %}
{% if error %}<div class="alert alert-error" role="alert">{{ icon('info') }}<div><strong>Something needs your attention</strong><p>{{ error }}</p></div></div>{% endif %}
{% if notice %}<div class="alert alert-success" role="status">{{ icon('check') }}<div><p>{{ notice }}</p></div></div>{% endif %}
